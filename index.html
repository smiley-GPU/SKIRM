  }
  if (a === 'lead') { plan.lead = n('id'); sfx('click'); return refresh(); }
  if (a === 'gear') { const id = n('id'); plan.gear = plan.gear.includes(id) ? plan.gear.filter((x) => x !== id) : [...plan.gear, id]; sfx('click'); return refresh(); }
  if (a === 'strike') { plan.strike = !plan.strike; sfx('click'); return refresh(); }
  if (a === 'abort') { if (!plan.abortArmed) { plan.abortArmed = true; return refresh(); } return run(abort); }
  if (a === 'route') { sfx('click'); return run(() => chooseRoute(n('i'))); }
  if (a === 'fork') { sfx('click'); return run(() => chooseFork(n('i'))); }
  if (a === 'exec') return run(() => execute({ opt: plan.opt, ids: plan.ids, lead: previewOf(plan.opt).lead, gear: plan.gear, strike: plan.strike }));
  if (a === 'push') return run(push);
  if (a === 'way') { // a way that costs gear asks which piece first
    const id = el.dataset.id, w = waysOut().find((x) => x.id === id);
    if (!w) { plan.way = null; return refresh(); }
    sfx('select');
    if (w.pick && gearChoices(w.pick).length) { plan.way = plan.way === id ? null : id; return refresh(); }
    plan.way = null;
    return run(() => wayOut(id));
  }
  if (a === 'waygear') { const id = plan.way; plan.way = null; sfx('select'); return run(() => wayOut(id, { uid: n('uid'), slot: el.dataset.slot })); }
  if (a === 'fway') { // from the failed roll: the failure lands, then the way is taken
    const id = el.dataset.id, w = waysOut(true).find((x) => x.id === id);
    if (!w) { plan.way = null; return refresh(); }
    sfx('select');
    if (w.pick && gearChoices(w.pick).length) { plan.way = plan.way === id ? null : id; return refresh(); }
    plan.way = null;

  }
  if (a === 'fwaygear') { const id = plan.way; plan.way = null; sfx('select'); return run(() => failWay(id, { uid: n('uid'), slot: el.dataset.slot })); }
  if (a === 'accept' || a === 'cost') {
    run(() => resolve(a === 'cost' ? el.dataset.c : undefined));
    const lines = G.battle?.lastResult?.lines || [];

    return;
  }
  if (a === 'skip') { sfx('click'); return run(skip); }
  if (a === 'care') { sfx('select'); return run(() => fieldCare(n('m'), n('t'))); }
  if (a === 'treat') { sfx('select'); return run(() => treat(n('h'), n('t'))); }

const GLOSSARY = {

  const terms = [

    ['Alert', `How awake the enemy is, 0 to ${ALERT_MAX}. At ${ALERT_TIER} they are alerted and shoot back harder; at ${ALERT_MAX} a quick reaction force forces you out.`],
    ['Time', 'Every action, route and rest spends time. When it runs out, the team has to leave.'],
    ['Difficulty', 'How many successes (dice showing 5 or 6) a test needs. One short is a success at a cost you choose.'],
    ['Push', 'Re-roll the misses once. A success at a cost pushes free; a failure costs 1 Nerve (or once a mission, a lieutenant giving the order). Every 1 on the new dice is something going wrong: a radio call, a bite, a jam, a dropped magazine.'],
    ['Nerve', 'Grit for pushing failures, brought to the team by rank: Private 0, Private First Class and Corporal 1, Sergeant and Staff Sergeant 2, Lieutenant 3. Shown next to Alert and Time.'],
    ['Rank', 'Promotions add dice (Corporal +1, Staff Sergeant +2) and Nerve. A sergeant leading has the best-armoured supporter step in front of the first hit; a lieutenant gives one free push a mission. A better barracks hires higher ranks.'],

    ['Close quarters', `Inside the objective, a stairwell or a pier. A handgun-only lead loses ${HANDGUN_PENALTY} Assault die everywhere else, unless they are a CQB specialist.`],

  ];
  return `<div class="help-head"><h2 id="help-title">How to play</h2><button class="btn ghost icon" type="button" id="help-close" aria-label="Close">${ico('cross')}</button></div>
    <div class="help-body">
      <div><h3>The campaign</h3><ol>
        <li><b>Base.</b> Pick an operation from the mission board, spend BP on departments and RP on recruits, treatment and gear.</li>
        <li><b>Briefing.</b> Buy intel, pick up to ${MAX_TEAM} operators and their loadouts, then the transport in and out.</li>
        <li><b>Operation.</b> Work through the route stage by stage, then get out.</li>
        <li><b>Debrief.</b> Injuries, promotions, loot and rewards. Then back to base.</li></ol></div>

        <li><b>Commit operators.</b> Tap an operator to add or stand them down; Make lead picks who rolls. More bodies make Stealth noisier (Scouts and infiltrators excepted), and only committed operators get shot.</li>
        <li><b>Everyone carries a handgun.</b> A primary weapon is optional. A lead with only the handgun rolls ${HANDGUN_PENALTY} Assault die fewer, except in close quarters or as a CQB specialist.</li>
        <li><b>Spend gear</b> for extra dice, then execute. Every 5 or 6 is a success. Meet the difficulty to succeed; one short is a success at a cost you choose.</li>
