<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKIRM Ops Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* SKIRM ops board: the mission is a route of stages, each resolved by approach + committed operators + dice. */
:root {
  --bg: #0f1216;
  --panel: #171b21;
  --panel-2: #1e242b;
  --panel-3: #262d36;
  --line: #2b323b;
  --line-soft: #232930;
  --fg: #e8ecef;
  --muted: #9ea9b2;
  --dim: #6f7a84;
  --accent: #5cc8e6;
  --accent-ink: #04222c;
  --accent-soft: rgba(92, 200, 230, 0.12);
  --ok: #6fd391;
  --ok-soft: rgba(111, 211, 145, 0.12);
  --warn: #f0c75e;
  --warn-soft: rgba(240, 199, 94, 0.12);
  --bad: #f0716a;
  --bad-soft: rgba(240, 113, 106, 0.12);
  --gold: #f2c14e;
  --toast-bg: #2b1715;
  --toast-fg: #ffdcd7;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 16px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
  color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
#app { min-height: 100%; display: flex; flex-direction: column; }
h1 { font: 700 30px/1.1 var(--body); letter-spacing: -0.01em; margin: 2px 0 6px; text-wrap: balance; }
h2 { font: 700 24px/1.15 var(--body); letter-spacing: -0.01em; margin: 2px 0 6px; text-wrap: balance; }
h3 { font: 600 13px/1.2 var(--body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
small, .muted { color: var(--muted); }
button, select, input { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 1.1em; height: 1.1em; flex: none; vertical-align: -0.18em; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: rgba(15, 18, 22, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-soft);
}
.brand { font: 700 22px/1 var(--display); letter-spacing: 0.22em; }
.brand span { font: 500 14px/1 var(--body); letter-spacing: 0.02em; color: var(--muted); margin-left: 8px; }
.phases { display: flex; gap: 4px; align-items: center; flex: 1; min-width: 0; font-size: 13px; font-weight: 600; }
.phases span { color: var(--dim); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.phases span.done { color: var(--muted); }
.phases span.on { color: var(--accent-ink); background: var(--accent); }
.phases i { color: var(--line); font-style: normal; }
.stats { display: flex; gap: 16px; font: 14px var(--body); font-variant-numeric: tabular-nums; }
.stats b { color: var(--muted); font-weight: 500; margin-right: 5px; }
.stats span { white-space: nowrap; }
.top-actions { display: flex; gap: 8px; }

main { flex: 1; min-height: 0; padding-block: 20px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* building blocks */
.card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--r-lg); padding: 18px 20px; min-width: 0; box-shadow: var(--shadow); }
.eyebrow { display: flex; align-items: center; gap: 6px; font: 600 12.5px/1.2 var(--body); text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 14px; cursor: pointer; touch-action: manipulation; transition: background 0.15s, border-color 0.15s, transform 0.08s; }
.btn:hover:not(:disabled) { background: var(--panel-3); border-color: #3b4450; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: #7bd5ee; border-color: #7bd5ee; }
.btn.danger { color: var(--bad); }
.btn.armed { border-color: var(--gold); color: var(--gold); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.icon { padding: 9px; }
.btn.big { padding: 13px 24px; font-size: 16px; font-weight: 700; border-radius: var(--r); }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 600 12px/1 var(--body); padding: 5px 9px; border-radius: 99px; background: var(--panel-2); white-space: nowrap; }
.chip.ok { color: var(--ok); background: var(--ok-soft); } .chip.warn { color: var(--warn); background: var(--warn-soft); } .chip.bad { color: var(--bad); background: var(--bad-soft); }
.chip.gold, .gold { color: var(--gold); font-style: normal; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--toast-bg); color: var(--toast-fg); border: 1px solid var(--bad); padding: 12px 18px; border-radius: var(--r); max-width: min(90vw, 560px); box-shadow: var(--shadow);
}
.cls { display: inline-block; font: 700 11px/1 var(--body); text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 7px; border-radius: 6px; background: var(--cls-bg); color: var(--cls-fg); white-space: nowrap; }
.cls-heavy { --cls-bg: #3a2c1d; --cls-fg: #f4bf75; }
.cls-scout { --cls-bg: #1d3424; --cls-fg: #93dea5; }
.cls-medic { --cls-bg: #3c1f23; --cls-fg: #ffa3a3; }
.cls-drone { --cls-bg: #1a2f3b; --cls-fg: #93d7ef; }
.sk { display: inline-flex; align-items: center; gap: 5px; font: 700 12px/1 var(--body); letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; }
.sk-assault { background: #3a2c1d; color: #f4bf75; }
.sk-stealth { background: #1d3424; color: #93dea5; }
.sk-recon { background: #1a2f3b; color: #93d7ef; }
.sk-tech { background: #2e2641; color: #cdbdf8; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tags span { font-size: 12.5px; color: var(--muted); background: var(--panel-3); border-radius: 6px; padding: 2px 7px; }
.tags .loud { color: #ffbdb6; background: var(--bad-soft); }
.tags .good { color: var(--ok); background: var(--ok-soft); }
.actions-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.actions-row .grow { flex: 1; }
@keyframes reveal { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* briefing */
.briefing { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; max-width: 1400px; margin: 0 auto; }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.area { color: var(--muted); margin: 0 0 12px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0 0 14px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
.objectives { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.objectives li { background: var(--panel-2); padding: 10px 12px; border-radius: var(--r-sm); }
.objectives b { margin-right: 6px; }
.tag { font: 700 11px/1 var(--body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--panel-3); border-radius: 6px; padding: 4px 7px; margin-right: 8px; }
.tag.primary { color: var(--gold); background: var(--warn-soft); }
.intel-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); }
.intel-row:first-of-type { border-top: 0; }
.intel-row small { display: block; }
.humint { margin-top: 8px; padding: 12px; background: var(--bad-soft); border-radius: var(--r-sm); display: grid; gap: 4px; }
.count { color: var(--fg); margin-left: 6px; }
.roster { display: grid; gap: 10px; }
.op { background: var(--panel-2); border: 1px solid transparent; border-radius: var(--r); padding: 10px 12px; }
.op.on { border-color: #2f6170; } .op.off { opacity: 0.55; }
.op-head { display: flex; align-items: center; gap: 10px; cursor: pointer; flex-wrap: wrap; }
.op-head input { accent-color: var(--accent); width: 18px; height: 18px; }
.rank { font: 600 12px var(--mono); color: var(--gold); min-width: 32px; }
.name { font-weight: 600; }
.op .meta { color: var(--muted); font-size: 13px; margin-left: auto; }
.xp { position: relative; height: 4px; background: #0b0e11; border-radius: 2px; margin: 6px 0 14px 28px; }
.xp i { position: absolute; inset: 0 auto 0 0; background: #3b8ba3; border-radius: 2px; }
.xp small { position: absolute; right: 0; top: 5px; font: 11px var(--mono); }
.loadout { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0 0 4px 28px; }
.loadout select { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px; font-size: 14px; min-width: 0; width: 100%; }
.loadout-hint { margin-left: 28px; font-size: 12.5px; color: var(--muted); }
.fallen { margin-top: 10px; font-size: 13px; color: var(--muted); font-style: italic; }
.ability { margin: 4px 0 0 28px; font-size: 13.5px; color: var(--muted); }
.skillline { margin: 4px 0 0 28px; font: 12.5px var(--mono); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.skillline b { color: var(--fg); font-weight: 600; }
.recruit { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-soft); display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
.recruit-btns, .class-pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.class-card { display: grid; gap: 6px; justify-items: start; text-align: left; }
.class-card small { font-size: 12.5px; }
.vehicles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.veh { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: grid; gap: 4px; align-content: start; }
.veh.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.veh input { position: absolute; opacity: 0; pointer-events: none; }
.veh-head { display: flex; justify-content: space-between; gap: 6px; }
.veh .cost { font: 12px var(--mono); color: var(--gold); }
.veh small { font-size: 13px; }
.launch { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.budget { display: flex; gap: 18px; font: 14px var(--mono); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.budget .bad { color: var(--bad); }
.howto ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; color: var(--muted); font-size: 14px; }
.howto b { color: var(--fg); font-weight: 600; }
.healing { margin: 2px 0 0 28px; font-size: 12.5px; color: var(--warn); }
.persona-line { margin: 4px 0 0 28px; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.trait { font: 700 11px/1 var(--body); text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold); background: var(--warn-soft); border-radius: 6px; padding: 4px 6px; }
.trait.bond { color: var(--accent); background: var(--accent-soft); }

/* route track (briefing preview and operation status) */
.route { list-style: none; margin: 0; padding: 0 0 2px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(140px, 1fr); gap: 8px; overflow-x: auto; }
.node { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: var(--r); padding: 9px 12px; min-width: 0; display: grid; gap: 2px; align-content: start; }
.node.cur { border-color: var(--accent); background: var(--accent-soft); }
.node.done { opacity: 0.55; }
.node.skipped { opacity: 0.4; text-decoration: line-through; }
.node .k { font: 600 11.5px/1.2 var(--body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
.node.cur .k { color: var(--accent); }
.node b { font-weight: 600; font-size: 14.5px; }
.node small { font-size: 12.5px; }

/* operation: status strip */
.ops { max-width: 1440px; margin: 0 auto; display: grid; gap: 16px; }
.status { display: grid; gap: 14px; padding: 14px 18px; }
.status-top { display: flex; align-items: center; gap: 14px 28px; flex-wrap: wrap; }
.meter { display: grid; gap: 6px; }
.meter .label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.meter .label b { color: var(--fg); font-weight: 600; }
.pipbar { display: flex; gap: 4px; }
.pipbar i { width: 22px; height: 8px; border-radius: 4px; background: var(--panel-3); }
.pipbar.alert i.on { background: var(--warn); }
.pipbar.alert i.on.hot { background: var(--bad); }
.pipbar.alert i.tier { margin-left: 8px; }
.pipbar.time i.on { background: var(--accent); }
.status-top .grow { flex: 1; }
.ops-body { display: grid; gap: 16px; align-items: start; grid-template-columns: minmax(0, 1fr); }
.ops-body.with-drawer { grid-template-columns: minmax(0, 1fr) 340px; }
.stage-col { display: grid; gap: 16px; min-width: 0; }

/* operation: the scene */
.scene-card { padding: 22px 24px; }
.scene-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.sit-text { color: var(--muted); margin: 0 0 18px; font-size: 16.5px; max-width: 70ch; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.tile { position: relative; display: grid; gap: 8px; align-content: start; text-align: left; background: var(--panel-2); border: 1px solid var(--line-soft); color: var(--fg); border-radius: var(--r); padding: 16px; cursor: pointer; touch-action: manipulation; transition: border-color 0.15s, background 0.15s, transform 0.12s; }
.tile:hover:not(:disabled) { border-color: #3d4752; transform: translateY(-1px); }
.tile.on { border-color: var(--accent); background: linear-gradient(180deg, rgba(92, 200, 230, 0.1), rgba(92, 200, 230, 0.03)); box-shadow: inset 0 0 0 1px var(--accent); }
.tile:disabled { opacity: 0.45; cursor: not-allowed; }
.tile .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile b { font-size: 17px; }
.tile small { font-size: 14px; }
.tile .pct { font: 700 26px/1 var(--display); letter-spacing: 0.01em; }
.tile .pct.lo { color: var(--bad); } .tile .pct.mid { color: var(--warn); } .tile .pct.hi { color: var(--ok); }
.tile .foot { font-size: 13px; color: var(--muted); }
.tile ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
.result { display: grid; gap: 6px; border-radius: var(--r); padding: 12px 14px; margin-bottom: 18px; background: var(--panel-2); border-left: 4px solid var(--line); animation: reveal 0.35s both; }
.result.SUCCESS { border-left-color: var(--ok); } .result.PARTIAL { border-left-color: var(--warn); } .result.FAIL { border-left-color: var(--bad); }
.result .rhead { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.result.SUCCESS .rhead { color: var(--ok); } .result.PARTIAL .rhead { color: var(--warn); } .result.FAIL .rhead { color: var(--bad); }
.result ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 14.5px; color: #c9d1d6; }
.result li.ev-down, .result li.ev-alert { color: #ffbdb6; } .result li.ev-kill { color: var(--bad); } .result li.ev-good { color: var(--ok); } .result li.ev-intel { color: var(--gold); }

/* operation: the roll */
.roll-sub { color: var(--muted); margin: 0 0 16px; }
.dice { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 18px; }
.die { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); font: 700 24px var(--mono); color: var(--muted); transition: background 0.2s, border-color 0.2s, color 0.2s; }
.die.hit { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.die.re { box-shadow: 0 0 0 2px var(--warn); }
.die.rolling { color: var(--fg); animation: tumble 0.18s linear infinite; }
@keyframes tumble { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(12deg) scale(0.94); } 100% { transform: rotate(0deg) scale(1); } }
.track { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; }
.track i { width: 34px; height: 10px; border-radius: 5px; background: var(--panel-3); transition: background 0.2s; }
.track i.on { background: var(--ok); }
.track span { margin-left: 8px; color: var(--muted); font-size: 14px; }
.track b { color: var(--fg); }
.roll-after { display: grid; gap: 14px; transition: opacity 0.25s; }
.roll-after.pending { opacity: 0; pointer-events: none; }
.outcome { display: flex; align-items: center; gap: 10px; font: 700 26px/1 var(--display); text-transform: uppercase; letter-spacing: 0.06em; }
.outcome.SUCCESS { color: var(--ok); } .outcome.PARTIAL { color: var(--warn); } .outcome.FAIL { color: var(--bad); }
.costs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.costs .btn { text-align: left; display: grid; justify-content: stretch; gap: 3px; padding: 14px; border-radius: var(--r); }
.costs .btn b { font-size: 16px; }

/* operation: the team tray */
.tray { display: grid; gap: 16px; }
.tray-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tray-head h3 { margin: 0; }
.tray-head small { font-size: 13.5px; }
.opcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.opcard { display: grid; align-content: start; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: var(--r); overflow: hidden; transition: border-color 0.15s, background 0.15s; }
.opcard.on { border-color: #3a7080; background: #1b2a31; }
.opcard.lead { border-color: var(--gold); background: #2a2516; box-shadow: inset 0 0 0 1px var(--gold); }
.opcard.out { opacity: 0.6; }
.opcard.gone { opacity: 0.35; }
.optoggle { display: grid; gap: 7px; text-align: left; background: none; border: 0; color: inherit; padding: 13px 14px; cursor: pointer; touch-action: manipulation; }
.optoggle:disabled { cursor: default; }
.oprow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.oprow b { font-size: 15.5px; }
.badge { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font: 700 11.5px/1 var(--body); text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
.badge.lead { background: var(--gold); color: #2a2000; }
.badge.down { background: var(--bad-soft); color: var(--bad); }
.util { font-size: 13px; }
.opdice { font-size: 14px; color: var(--muted); }
.opdice b { font: 700 22px/1 var(--display); color: var(--fg); margin-right: 3px; }
.opdice b.dim { color: var(--muted); }
.opskills { font: 12.5px var(--mono); color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.opskills b { color: var(--fg); }
.injlist { display: grid; gap: 3px; }
.inj { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: #ffbdb6; }
.inj .ico { color: var(--bad); align-self: center; }
.inj small { color: var(--muted); font-size: 12.5px; }
.inj.crit, .inj.crit small { color: var(--bad); }
.unhurt { font-size: 13px; color: var(--ok); }
.care { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 12px; }
.care .btn { padding: 6px 10px; font-size: 13px; }
.gearrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.gearrow .btn.on { border-color: var(--gold); color: var(--gold); background: var(--warn-soft); }
.go { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 3; display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; background: var(--panel-3); border: 1px solid #353e49; border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); }
.go-odds { flex: 1; min-width: 240px; display: grid; gap: 7px; }
.go-nums { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.go-nums .big { font: 700 26px/1 var(--display); color: var(--fg); }
.oddsbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--bg); }
.oddsbar .s { background: var(--ok); } .oddsbar .p { background: var(--warn); } .oddsbar .f { background: var(--bad); }

.oddstext span { display: inline-flex; align-items: center; gap: 4px; }
.oddstext .s { color: var(--ok); } .oddstext .p { color: var(--warn); } .oddstext .f { color: var(--bad); }
.details { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 24px; background: var(--bg); border-radius: var(--r); padding: 14px 16px; font-size: 14px; }
.details ul { list-style: none; margin: 6px 0 0; padding: 0; color: var(--muted); display: grid; gap: 2px; }
.details .big { font: 700 22px/1 var(--display); color: var(--fg); }
.risk { grid-column: 1 / -1; display: grid; gap: 3px; font-size: 14px; }
.risk .bad { color: #ffbdb6; }

/* operation: drawer */
.drawer { display: grid; gap: 18px; position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow: hidden; grid-template-rows: auto minmax(0, 1fr); }
.drawer .obj { display: grid; gap: 6px; font-size: 14.5px; }
.drawer .obj b { color: var(--gold); margin-right: 4px; }
.log { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.log ol { list-style: none; margin: 0; padding: 0; font-size: 14px; overflow-y: auto; min-height: 0; }
.log li { padding: 5px 0; border-bottom: 1px solid var(--line-soft); color: #bcc5cb; }
.log .ev-turn { color: var(--accent); font-weight: 600; padding-top: 10px; }
.log .ev-alert, .log .ev-down { color: #ffbdb6; } .log .ev-kill { color: var(--bad); } .log .ev-intel { color: var(--gold); } .log .ev-good { color: var(--ok); }

/* transit scenes: interlude + insertion / extraction */
.transit { max-width: 980px; margin: 0 auto; }
.transit-card { padding: 26px 28px; display: grid; gap: 16px; }
.transit-card h1 { margin-bottom: 0; }
.transit .scene { color: var(--muted); font-style: italic; font-size: 17px; margin: 0; }
.transit .prompt { margin: 4px 0 0; color: var(--fg); font-size: 14px; }
.lines { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.line { display: grid; gap: 8px; align-content: start; text-align: left; background: var(--panel-2); border: 1px solid var(--line-soft); color: var(--fg); border-radius: var(--r); padding: 16px; cursor: pointer; font: inherit; touch-action: manipulation; transition: border-color 0.15s, transform 0.12s, opacity 0.2s; }
.line:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
.line.on { border-color: var(--gold); background: #2a2516; box-shadow: inset 0 0 0 1px var(--gold); }
.line.faded { opacity: 0.4; }
.line:disabled { cursor: default; }
.line .who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.line .persona { font-size: 13px; color: var(--muted); }
.line q, .words q { font-size: 16.5px; line-height: 1.5; quotes: '\201C' '\201D'; }
.line .hint { justify-self: start; font: 700 11px/1 var(--body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--panel-3); border-radius: 6px; padding: 5px 7px; }

.reveal b { color: var(--gold); } .reveal span { color: var(--fg); }

.narrative { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; font-size: 16.5px; }
.narrative li { position: relative; padding-left: 18px; animation: reveal 0.5s both; }
.narrative li::before { content: ""; position: absolute; left: 2px; top: 0.6em; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.narrative li.bad { color: #ffbdb6; } .narrative li.bad::before { background: var(--bad); }
.report { max-width: 760px; margin: 24px auto; padding: 26px 28px; }
.report .narrative { margin: 18px 0 26px; }

/* debrief */
.debrief { max-width: 980px; margin: 0 auto; display: grid; gap: 18px; }
.verdict { display: inline-flex; align-items: center; gap: 8px; margin: 10px 0; padding: 8px 16px; border-radius: var(--r-sm); font: 700 20px/1 var(--display); text-transform: uppercase; letter-spacing: 0.08em; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); } .verdict.bad { background: var(--bad-soft); color: var(--bad); }
.obj-results { list-style: none; padding: 0; display: grid; gap: 4px; }
.obj-results span { display: inline-block; width: 20px; }
.obj-results .ok span { color: var(--ok); } .obj-results .bad span { color: var(--bad); }
.table-wrap { overflow-x: auto; }
.personnel { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.personnel th, .personnel td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
.personnel th { color: var(--muted); font-weight: 500; font-size: 13px; }
.personnel tr.lost td { color: var(--bad); }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
.split ul { margin: 0; padding-left: 18px; }
.debrief > .btn { justify-self: end; }
.words { display: grid; gap: 12px; }
.words div { display: grid; gap: 3px; }
.words small { color: var(--gold); }

@media (max-width: 1180px) {
  .ops-body.with-drawer { grid-template-columns: minmax(0, 1fr); }
  .drawer { position: static; max-height: none; }
  .log ol { max-height: 320px; }
}
@media (max-width: 980px) {
  .briefing { grid-template-columns: 1fr; }
  .vehicles { grid-template-columns: 1fr; }
  .phases { display: none; }
  .launch { flex-direction: column; align-items: stretch; }
}
@media (max-width: 560px) {
  main { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 12px; }
  .top { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); gap: 8px 12px; }
  .stats { gap: 10px; font-size: 13px; }
  .card { padding: 14px; border-radius: var(--r); }
  .scene-card, .transit-card { padding: 16px; }
  .loadout { grid-template-columns: 1fr; }
  .opcards { grid-template-columns: 1fr 1fr; gap: 8px; }
  .optoggle { padding: 10px; }
  .tiles { grid-template-columns: 1fr; }
  .go-odds { min-width: 0; flex-basis: 100%; }
  .go .btn { padding: 10px 12px; }
  .go .btn.primary { flex: 1; white-space: nowrap; }
  h1 { font-size: 25px; }
  h2 { font-size: 21px; }
  .pipbar i { width: 15px; }
  .die { width: 44px; height: 44px; font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .narrative li, .die, .result, .reveal { animation: none; }
  .tile, .line, .btn { transition: none; }
}

const compFactor = (e) => ({ DAY: 1, DUSK: 0.8, NIGHT: 0.6 })[e.time];
/** Difficulty modifiers from time of day and weather, per skill. */
function envMods(e, skill) {
  const out = [];
  const t = { DAY: { STEALTH: 1 }, DUSK: {}, NIGHT: { STEALTH: -1, RECON: 1 } }[e.time][skill];
  if (t) out.push({ label: e.time === 'DAY' ? 'Daylight' : 'Darkness', v: t });
  const w = { CLEAR: {}, RAIN: { STEALTH: -1, RECON: 1 }, FOG: { STEALTH: -1, RECON: 1 } }[e.weather][skill];
  if (w) out.push({ label: e.weather === 'RAIN' ? 'Heavy rain' : 'Dense fog', v: w });
  return out;
}
function envSummary(e) {
  const base = `${{ DAY: 'Daylight', DUSK: 'Dusk', NIGHT: 'Night' }[e.time]}, ${{ CLEAR: 'clear skies', RAIN: 'heavy rain', FOG: 'dense fog' }[e.weather]}.`;
  const fx = Object.keys(SKILLS).map((k) => [k, envMods(e, k).reduce((s, x) => s + x.v, 0)]).filter(([, v]) => v)
    .map(([k, v]) => `${SKILLS[k].label} ${v > 0 ? 'harder' : 'easier'} (${v > 0 ? '+' : ''}${v})`);
  return `${base} ${fx.length ? fx.join(', ') + '.' : 'No effect on tests.'}`;
}
const signed = (v) => (v > 0 ? '+' : '') + v;
function itemSummary(id) {
  const it = ITEMS[id];
  if (it.slot !== 'UTILITY') return [it.dr ? `${it.dr > 1 ? 'much ' : ''}less chance a hit is serious` : '', ...Object.entries(it.dice || {}).map(([k, v]) => `${signed(v)} ${SKILLS[k].label}`)].filter(Boolean).join(', ');
  return {
    MEDKIT: 'Treats the worst injury: wakes the unconscious, splints a critical, straps a serious one, or cleans up cuts and bruises',
    FRAG: `+${GEAR_USE.FRAG.dice} dice on one Assault test`,
    BREACH: `+${GEAR_USE.BREACH.dice} dice on one Tech or Assault test, loud (+1 alert)`,
    DRONE: 'Launch: reveals 2 stages ahead, +1 Recon die, 1 strike',
  }[id];
}
/** Dice an operator brings to a skill test: class + rank + weapon + armour. */
function diceFor(cls, xp, weapon, armor, skill) {
  let n = CLASSES[cls].dice[skill] + rankDice(xp);
  for (const it of [weapon, armor]) if (it && ITEMS[it].dice?.[skill]) n += ITEMS[it].dice[skill];
  return Math.max(0, n);
}

// =====================================================================================
// SEEDED RNG + small helpers
// =====================================================================================
let G = null; // the whole save game: plain JSON
function rnd() { // mulberry32, state kept in the save so reloads stay deterministic
  let t = (G.rs = (G.rs + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const range = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));
const chance = (p) => rnd() * 100 < p;
const pick = (a) => a[Math.floor(rnd() * a.length)];
const pickN = (a, k) => { const c = [...a], out = []; while (out.length < k && c.length) out.push(c.splice(Math.floor(rnd() * c.length), 1)[0]); return out; };
const d6 = () => range(1, 6);
const HIT = 5; // a die showing 5 or 6 is a success

/** Exact odds for n dice against difficulty d: success, partial (one short), fail. */
function odds(n, d) {
  let dist = [1];
  for (let i = 0; i < n; i++) {
    const next = new Array(dist.length + 1).fill(0);
    dist.forEach((p, k) => { next[k] += p * (2 / 3); next[k + 1] += p / 3; });
    dist = next;
  }
  const at = (k) => dist[k] || 0;
  let s = 0;
  for (let k = d; k < dist.length; k++) s += at(k);
  const p = d >= 1 ? at(d - 1) : 0;
  return { s, p, f: Math.max(0, 1 - s - p) };
}

class Rule extends Error {}
const fail = (m) => { throw new Rule(m); };

// CAMPAIGN + MISSION GENERATION

function newCampaign(seed) {
  G = { v: 3, mode: 'ops', rs: seed | 0, phase: 'BRIEFING', rp: 12, flown: 0, nextSid: 1, roster: [], used: {}, recruits: 0,
    armory: { CARBINE: 4, SMG: 2, DMR: 1, LMG: 2, AK: 0, VEST: 4, PLATE: 2, MEDKIT: 3, FRAG: 4, BREACH: 3, DRONE: 2 },
    mission: null, battle: null, debrief: null };
  [[60, 'HEAVY'], [25, 'MEDIC'], [25, 'SCOUT'], [0, 'DRONE'], [0, 'HEAVY'], [0, 'SCOUT']].forEach(([xp, cls]) => recruit(xp, cls));
  beginBriefing();
}
function recruit(xp, cls) {
  let name;
  const firstTaken = (n) => G.roster.some((s) => s.alive && s.name.split(' ')[0] === n.split(' ')[0]); // first names must tell living operators apart
  do name = pick(FIRST) + ' ' + pick(LAST); while (G.used[name] || firstTaken(name));
  G.used[name] = 1;
  const s = { id: G.nextSid++, name, cls, xp, kills: 0, missions: 0, recovery: 0, healing: [], alive: true, persona: freePersona(), traits: [], bonds: [], signature: null };
  G.roster.push(s);
  return s;
}
/** A personality nobody alive on the roster has yet (20 personalities, at most 8 operators). */
function freePersona() {
  const taken = new Set(G.roster.filter((s) => s.alive).map((s) => s.persona));
  return pick(Object.keys(PERSONAS).filter((k) => !taken.has(k)));
}
const soldier = (id) => G.roster.find((s) => s.id === id);
const hasTrait = (sid, t) => !!soldier(sid)?.traits?.includes(t);
const available = (s) => s.alive && s.recovery === 0;

function beginBriefing() {
  for (const s of G.roster) if (s.recovery > 0 && --s.recovery === 0) s.healing = [];
  G.mission = genMission(G.flown + 1);
  G.battle = null;
  G.debrief = null;
  G.phase = 'BRIEFING';
}

/** A mission is a route: approach → perimeter (1-2) → objective → optional target → exfil. Forks offer two choices. */
function genMission(n) {
  const codename = 'Operation ' + pick(ADJ) + ' ' + pick(NOUN);
  const area = pick(AREAS);
  const env = { time: pick(['DAY', 'DUSK', 'NIGHT']), weather: chance(60) ? 'CLEAR' : chance(50) ? 'RAIN' : 'FOG' };
  const primary = chance(50) ? 'RETRIEVE_INTEL' : 'ELIMINATE_HVT';
  const secondary = pick(Object.keys(OBJ).filter((o) => o !== primary));
  const sitFor = (o) => (o === 'RETRIEVE_INTEL' ? 'INTEL' : 'HVT');
  const perimeter = Object.keys(SIT).filter((k) => SIT[k].kind === 'PERIMETER');
  const route = [{ kind: 'APPROACH', choices: pickN(Object.keys(ROUTES), 2), pick: null }];
  for (let i = 0; i < (n >= 3 ? 2 : 1); i++) route.push({ kind: 'PERIMETER', choices: pickN(perimeter, 2), pick: null });
  route.push({ kind: 'OBJECTIVE', choices: [sitFor(primary)], pick: 0 });
  if (secondary === 'RETRIEVE_INTEL' || secondary === 'ELIMINATE_HVT') route.push({ kind: 'OPTIONAL', choices: [sitFor(secondary)], pick: 0 });
  else if (chance(50)) route.push({ kind: 'OPTIONAL', choices: ['CACHE'], pick: 0 });
  route.push({ kind: 'EXFIL', choices: ['BREAK'], pick: 0 });
  let rAt = 0, rCount = 0;
  if (chance(55)) { rAt = range(3, 5); rCount = range(1, 2); }
  return { n, codename, area, env, primary, secondary, route, rAt, rCount, intel: [], team: [], loadouts: {}, ins: null, ext: null, insReport: [], extReport: [],
    interIn: null, interOut: null, bonusXp: {} };
}
const hasObj = (m, t) => m.primary === t || m.secondary === t;
function threat(m) {
  const n = m.route.reduce((s, st) => s + (st.kind === 'APPROACH' ? 0 : Math.max(...st.choices.map((c) => SIT[c].foes))), 0);
  return n <= 5 ? 'Light: a squad-sized element.' : n <= 7 ? 'Moderate: a reinforced squad.' : 'Heavy: platoon-strength presence.';
}

// =====================================================================================
// OPERATION ENGINE: every rule check lives here. Commands throw Rule before mutating anything.
// =====================================================================================
const B = () => G.battle;
const team = () => B().units;
const active = (u) => !u.dead && !u.downed && !u.exfil && !u.stranded && !u.missing;
const unitById = (id) => team().find((u) => u.id === id);
const dr = (u) => (u.armor ? ITEMS[u.armor].dr : 0);
/** Dice changes from injuries on one skill, one line per injury that matters. */
const injuryMods = (u, skill) => u.inj.map((w) => ({ label: INJURIES[w.id].label, v: injFx(w)[skill] || 0 })).filter((x) => x.v);
const opDice = (u, skill) => Math.max(0, diceFor(u.cls, soldier(u.sid).xp, u.weapon, u.armor, skill) + injuryMods(u, skill).reduce((s, x) => s + x.v, 0))
  + leadBonuses(u, skill).reduce((s, x) => s + x.v, 0);
const omenName = (om) => unitById(om.uid)?.name.split(' ')[0] ?? 'Someone';
/** Extra lead dice from the mission's omen, lasting traits and a signature weapon. omen: true = spent when used. */
function leadBonuses(u, skill) {
  const out = [], om = B().omen, s = soldier(u.sid), helps = (ITEMS[u.weapon]?.dice?.[skill] || 0) > 0;
  if (om?.uid === u.id) {
    if (om.topic === 'GEAR' && !om.used && helps) out.push({ label: `${ITEMS[u.weapon].label}: proving it`, v: 2, omen: true });
    if (om.topic === 'BLIND' && skill === 'RECON') out.push({ label: 'Trusting instinct', v: 1 });
    if (om.topic === 'OBJECTIVE' && cur().kind === 'OBJECTIVE') out.push({ label: 'Determined', v: 1 });
  }
  if (s.traits?.includes('DEADEYE') && skill === 'ASSAULT') out.push({ label: 'Deadeye', v: 1 });
  if (s.traits?.includes('SHADOW') && skill === 'STEALTH') out.push({ label: 'Shadow', v: 1 });
  if (s.signature && s.signature === u.weapon && helps) out.push({ label: `Signature ${ITEMS[u.weapon].label}`, v: 1 });
  return out;
}
/** An untreated critical injury keeps an operator from leading. */
const canLead = (u) => active(u) && !u.inj.some((w) => INJURIES[w.id].tier === 3 && !w.t);
const cur = () => B().stages[B().stage];
const sitOf = (st) => (st.kind === 'APPROACH' || st.pick == null ? null : SIT[st.choices[st.pick]]);
const alerted = () => B().alert >= ALERT_TIER;

function log(text, kind = 'info') {
  const l = B().log;
  l.push({ text, kind });
  if (l.length > 120) l.splice(0, l.length - 120);
  B().capture?.push({ text, kind }); // collected while a roll resolves, to tell the result on screen
}

function makeOp(m, members) {
  G.battle = { units: [], nextId: 1, alert: 0, alerted: false, time: BASE_TIME + VEH[m.ins].time, timeMax: 0, stage: 0,
    stages: JSON.parse(JSON.stringify(m.route)), attempts: 0, reinf: 0, state: 'PLAN', roll: null, revived: [],
    drone: { up: false, op: null, strike: 0, used: false }, hvtKilled: false, carrier: null, cache: false, kills: 0, over: false, done: false, log: [], omen: null, lastResult: null };
  const b = G.battle;
  for (const s of members) {
    const l = m.loadouts[s.id];
    // inj: [{ id, t: treated, clock: stages left on an untreated critical }]. downed = unconscious, bleed = stages to live.
    // cared/caredBy/weaponWins/boom: what happened, for the extraction interlude.
    b.units.push({ id: b.nextId++, sid: s.id, name: s.name, cls: s.cls, inj: [], dead: false, wasOut: false, cared: [], caredBy: [], weaponWins: 0, boom: null, shrugged: false,
      weapon: l.weapon, armor: l.armor, util: l.utility, consumed: null, kills: 0, killedHvt: false, revives: 0, tests: 0,
      downed: false, bleed: 0, exfil: false, stranded: false, missing: false, droneLost: false });
  }
  b.stages[0].seen = true;
  log(`Stage 1: ${KIND.APPROACH}. Choose a route in.`, 'turn');
}

/** Hostiles at a stage. Reinforcements add one everywhere that is defended, and their full number at the exfil. */
function foesOf(st, sit) {
  const b = B();
  if (st.kind === 'EXFIL') return (alerted() ? 3 : 1) + b.reinf;
  if (st.foesCleared) return 0;
  return sit.foes ? sit.foes + (b.reinf ? 1 : 0) : 0;
}
/** Difficulty with an itemised breakdown, so the UI never has to guess. */
function difficulty(st, sit, opt, ids) {
  const b = B(), m = G.mission, mods = [{ label: 'Base', v: opt.diff }];
  const add = (label, v) => { if (v) mods.push({ label, v }); };
  add('Enemy experience', Math.floor((m.n - 1) / 3));
  for (const e of envMods(m.env, opt.skill)) add(e.label, e.v);
  add('Approach route', st.mod?.[opt.skill] || 0);
  if (opt.skill === 'STEALTH') {
    add('Area alerted', alerted() ? 1 : 0);
    const bodies = ids.map(unitById).filter((u) => u && u.cls !== 'SCOUT').length;
    add(`Noise: ${bodies} non-Scouts`, Math.max(0, bodies - STEALTH_LIMIT));
    add('Carrying wounded', team().filter((u) => u.downed).length);
    for (const u of ids.map(unitById)) for (const w of u?.inj || []) add(`${u.name.split(' ')[0]}: ${INJURIES[w.id].label.toLowerCase()}`, INJURIES[w.id].noise || 0);
  }
  if (opt.skill === 'ASSAULT') { add('Enemy dug in (alerted)', alerted() ? 1 : 0); add('Enemy reinforced', b.reinf ? 1 : 0); }
  if (st.kind === 'OBJECTIVE' && m.intel.includes('HUMINT')) add('Deep intel on the layout', -1);
  if (st.kind === 'EXFIL') { const x = VEH[m.ext].exfil; add(`${VEH[m.ext].label} pickup`, (x.all || 0) + (x[opt.skill] || 0)); }
  const om = b.omen, who = om ? omenName(om) : '';
  if (om?.topic === 'THREAT' && om.sit !== 'HVT' && !om.beaten && st.pick != null && st.choices[st.pick] === om.sit) add(`${SIT[om.sit].label}, as ${who} feared`, 1);
  if (om?.topic === 'ENV' && !om.used && opt.skill === om.skill) mods.push({ label: `${who} read the conditions`, v: -1, omen: true });
  if (om?.topic === 'RIDE' && st.kind === 'EXFIL') add(`${who} planned the way out`, -1);
  return { value: Math.max(1, mods.reduce((s, x) => s + x.v, 0)), mods };
}
/** Dice pool with breakdown: the lead rolls their full skill, each supporter adds one die. */
function poolOf(opt, ids, gearIds, strike, leadId) {
  const parts = [];
  for (const id of ids) {
    const u = unitById(id);
    if (id !== leadId) { parts.push({ label: `${u.name} (support)`, v: 1 }); continue; }
    let n = diceFor(u.cls, soldier(u.sid).xp, u.weapon, u.armor, opt.skill);
    parts.push({ label: `${u.name} (lead)`, v: n });
    for (const x of injuryMods(u, opt.skill)) { const v = Math.max(x.v, -n); if (v) { parts.push({ label: x.label, v }); n += v; } }
    for (const x of leadBonuses(u, opt.skill)) parts.push(x);
  }
  const b = B(), om = b.omen;
  if (om?.topic === 'MATE' && ids.includes(om.uid) && ids.includes(om.mate)) parts.push({ label: `${omenName(om)} has ${unitById(om.mate).name.split(' ')[0]}'s back`, v: 1 });
  const us = ids.map(unitById);

/** Dice tumble and settle one by one, filling the success track; the outcome and its buttons appear when they stop. */
function animateRoll() {
  const r = B().roll, box = $('.dice[data-roll]'), after = $('.roll-after');
  const key = box.dataset.roll;
  if (ui.rolled === key || calm()) { ui.rolled = key; return; }
  ui.rolled = key;
  const dice = [...box.children], track = [...document.querySelectorAll('.track i')], count = $('.track b');
  const moving = r.pushed ? r.rerolled : r.dice.map((_, i) => i);
  let hits = r.dice.filter((d, i) => d >= HIT && !moving.includes(i)).length, left = moving.length;
  const paint = () => { track.forEach((t, i) => t.classList.toggle('on', i < hits)); count.textContent = hits; };
  const done = () => { after.classList.remove('pending'); const out = outcomeOf(r); sfx(out.toLowerCase()); if (out === 'FAIL') buzz(60); };
  if (!left) return;
  after.classList.add('pending');
  for (const i of moving) { dice[i].classList.remove('hit'); dice[i].classList.add('rolling'); }
  paint();
  sfx('dice');
  moving.forEach((i, k) => {
    const el = dice[i], end = Date.now() + 420 + k * 120;
    const spin = setInterval(() => {
      if (Date.now() < end) { el.textContent = 1 + Math.floor(Math.random() * 6); return; } // purely visual, not the game's seeded dice
      clearInterval(spin);
      el.textContent = r.dice[i];
      el.classList.remove('rolling');
      if (r.dice[i] >= HIT) { el.classList.add('hit'); hits++; paint(); sfx('tick'); }
      if (--left === 0) done();
    }, 55);
  });
}
// One delegated handler for every operation-screen button.
$('#view').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');

  const a = el.dataset.act, n = (k) => +el.dataset[k];
  if (a !== 'abort') plan.abortArmed = false;
  if (a === 'drawer') { ui.drawer = !ui.drawer; saveUi(); sfx('click'); return refresh(); }
  if (a === 'details') { ui.details = !ui.details; saveUi(); sfx('click'); return refresh(); }
  if (a === 'opt') { plan.opt = n('i'); plan.lead = null; sfx('click'); return refresh(); }
  if (a === 'op') { // off → in (support, or lead if first) → lead → off
    const id = n('id'), u = unitById(id), on = plan.ids.includes(id), isLead = previewOf(plan.opt).lead === id;
    if (!on) {
      if (plan.ids.length > MAX_SUPPORT) return toast(`A fireteam is a lead and ${MAX_SUPPORT} in support. Stand someone down first.`);
      plan.ids = [...plan.ids, id];
    } else if (!isLead && canLead(u)) plan.lead = id;
    else { plan.ids = plan.ids.filter((x) => x !== id); if (plan.lead === id) plan.lead = null; }
    sfx('click');
    return refresh();
  }
  if (a === 'gear') { const id = n('id'); plan.gear = plan.gear.includes(id) ? plan.gear.filter((x) => x !== id) : [...plan.gear, id]; sfx('click'); return refresh(); }
  if (a === 'strike') { plan.strike = !plan.strike; sfx('click'); return refresh(); }
  if (a === 'abort') { if (!plan.abortArmed) { plan.abortArmed = true; return refresh(); } return run(abort); }
  if (a === 'route') { sfx('click'); return run(() => chooseRoute(n('i'))); }
  if (a === 'fork') { sfx('click'); return run(() => chooseFork(n('i'))); }
  if (a === 'exec') return run(() => execute({ opt: plan.opt, ids: plan.ids, lead: previewOf(plan.opt).lead, gear: plan.gear, strike: plan.strike }));

      <div class="class-pick">${Object.entries(CLASSES).map(([id, c]) => `<button class="btn class-card" type="button" data-enlist="${id}">${classChip(id)}<small>${c.ability}</small></button>`).join('')}</div></div>` : ''}
    <button class="btn primary big" type="button" id="next" ${G.recruits > 0 ? 'disabled' : ''}>Next mission</button></section>`;
  $('#view').querySelectorAll('[data-enlist]').forEach((b) => b.addEventListener('click', () => run(() => { const s = enlist(b.dataset.enlist); toast(`${s.name} joins as ${CLASSES[s.cls].label}.`); })));
  $('#next').addEventListener('click', () => run(proceed));
}

// ------------------------------------------------------------------ boot
$('#btn-sound').addEventListener('click', () => {
  ui.sound = !ui.sound; saveUi();
  sfx('select'); buzz(30);
  refresh();
});
$('#btn-new').addEventListener('click', (e) => {
  const b = e.currentTarget;
  if (b.dataset.armed) {
    delete b.dataset.armed; b.textContent = 'New campaign';
    draft.mission = null; plan.key = null; mounted = null;
    newCampaign((Math.random() * 2 ** 31) | 0);
    persist(); refresh();
    return;
  }
  b.dataset.armed = '1'; b.textContent = 'Tap again to restart';
  setTimeout(() => { delete b.dataset.armed; b.textContent = 'New campaign'; }, 3000);
});

/** v2 saves (before interludes): give every soldier a personality and empty traits; mid-mission units get event counters. */
function migrateV2() {
  for (const s of G.roster) { s.traits ??= []; s.bonds ??= []; s.signature ??= null; if (!s.persona) s.persona = freePersona(); }
  for (const u of G.battle?.units || []) { u.cared ??= []; u.caredBy ??= []; u.weaponWins ??= 0; u.boom ??= null; u.shrugged ??= false; }
  if (G.battle) G.battle.omen ??= null;
  if (G.mission) G.mission.bonusXp ??= {};
  G.v = 3;
}
function start(data) {
  let save = data && data.save;
  if (!save) { try { save = localStorage.getItem(SAVE_KEY); } catch (e) { save = null; } }
  try { G = save ? JSON.parse(save) : null; } catch (e) { G = null; }
  if (G?.v === 2 && G.mode === 'ops') migrateV2();
  if (!G || G.v !== 3 || G.mode !== 'ops') newCampaign((Math.random() * 2 ** 31) | 0);
  window.claude?.hot?.snapshot?.(() => ({ save: JSON.stringify(G) }));
  refresh();
}
// Test hook: index.html?test exposes the rules API to automated play-throughs.
if (/[?&]test\b/.test(location.search)) {
  window.SKIRM = { get G() { return G; }, newCampaign, buyIntel, launch, proceed, enlist, chooseRoute, chooseFork, execute, push, resolve, skip, abort,
    fieldCare, treat, launchDrone, canLead, opDice, chooseLine, interlude, PERSONAS, TOPICS, LINES, TRAITS, worstNeed, fieldCareNeed, INJURIES, bestLead, odds, difficulty, poolOf, previewOf, cur, sitOf, active, team, outcomeOf, foesOf, Rule, CLASSES, ITEMS, SIT, available, refresh };
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
