<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKIRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: field-terminal UI. Sticky command bar, phase screens below; tactical = map + order panel (stacked on phones). */
:root {
  --bg: #0d1112;
  --panel: #151b1c;
  --panel-2: #1c2425;
  --line: #2a3537;
  --fg: #dde5e3;
  --muted: #86948f;
  --accent: #63c3d8;
  --accent-ink: #052129;
  --ok: #73d08c;
  --warn: #e3c351;
  --bad: #e2645b;
  --gold: #e6b752;
  --toast-bg: #2b1614;
  --toast-fg: #ffd9d4;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --radius: 6px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
#app { min-height: 100%; display: flex; flex-direction: column; }
h1 { font: 700 30px/1.05 var(--display); letter-spacing: 0.01em; margin: 2px 0 4px; text-wrap: balance; text-transform: uppercase; }
h3 { font: 600 13px/1.2 var(--display); text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin: 0 0 10px; }
small, .muted { color: var(--muted); }
button, select, input { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { font: 700 20px/1 var(--display); letter-spacing: 0.24em; }
.brand span { font-weight: 500; letter-spacing: 0.06em; color: var(--muted); margin-left: 6px; font-size: 15px; }
.phases { display: flex; gap: 6px; align-items: center; flex: 1; font: 600 13px/1 var(--display); text-transform: uppercase; letter-spacing: 0.1em; min-width: 0; }
.phases span { color: #56625f; }
.phases span.done { color: var(--muted); }
.phases span.on { color: var(--accent); }
.phases i { color: #3a4644; font-style: normal; }
.stats { display: flex; gap: 14px; font: 13px var(--mono); font-variant-numeric: tabular-nums; }
.stats b { color: var(--muted); font-weight: 400; margin-right: 4px; }

main { flex: 1; min-height: 0; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.eyebrow { font: 600 13px/1 var(--display); text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent); }
.btn { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 8px 12px; cursor: pointer; touch-action: manipulation; }
.btn:hover:not(:disabled) { border-color: #4b5b58; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.armed { border-color: var(--gold); color: var(--gold); }
.btn.ghost { background: transparent; }
.btn.big { padding: 12px 22px; font: 700 17px/1 var(--display); text-transform: uppercase; letter-spacing: 0.1em; }
.chip { display: inline-block; font: 600 12px/1 var(--display); padding: 4px 8px; border-radius: 99px; border: 1px solid currentColor; text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
.chip.gold, .gold { color: var(--gold); font-style: normal; }
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  background: var(--toast-bg); color: var(--toast-fg); border: 1px solid var(--bad); padding: 10px 16px; border-radius: 6px; max-width: min(90vw, 560px);
}

/* briefing */
.briefing { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; max-width: 1400px; margin: 0 auto; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.area { color: var(--muted); margin: 0 0 12px; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0 0 14px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; }
.objectives { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.objectives li { background: var(--panel-2); padding: 8px 10px; border-radius: 5px; }
.objectives b { margin-right: 6px; }
.tag { font: 600 11px/1 var(--display); text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; margin-right: 8px; }
.tag.primary { color: var(--gold); border-color: var(--gold); }
.preview-wrap { height: 300px; background: #0a0d0e; border-radius: 5px; overflow-x: auto; }
#preview { width: 100%; min-width: 520px; height: 100%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.legend span { white-space: nowrap; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.sw.ins { background: rgb(92,160,230); } .sw.ext { background: rgb(120,220,140); } .sw.obj { background: #f2d14b; } .sw.foe { background: var(--bad); border-radius: 50%; }
.intel-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.intel-row:first-of-type { border-top: 0; }
.intel-row small { display: block; }
.humint { margin-top: 8px; padding: 10px; background: #261816; border: 1px solid #4b2825; border-radius: 5px; display: grid; gap: 4px; }
.count { color: var(--fg); margin-left: 6px; }
.roster { display: grid; gap: 8px; }
.op { background: var(--panel-2); border: 1px solid transparent; border-radius: 5px; padding: 8px 10px; }
.op.on { border-color: #2f5a63; } .op.off { opacity: 0.55; }
.op-head { display: flex; align-items: center; gap: 10px; cursor: pointer; flex-wrap: wrap; }
.op-head input { accent-color: var(--accent); width: 18px; height: 18px; }
.rank { font: 600 12px var(--mono); color: var(--gold); min-width: 32px; }
.name { font-weight: 600; }
.op .meta { color: var(--muted); font-size: 13px; margin-left: auto; }
.xp { position: relative; height: 4px; background: #0b0f10; border-radius: 2px; margin: 6px 0 14px 28px; }
.xp i { position: absolute; inset: 0 auto 0 0; background: #3b8095; border-radius: 2px; }
.xp small { position: absolute; right: 0; top: 5px; font: 11px var(--mono); }
.loadout { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0 0 4px 28px; }
.loadout select { background: #0e1314; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px; font-size: 14px; min-width: 0; width: 100%; }
.loadout-hint { margin-left: 28px; font-size: 12px; color: var(--muted); }
.fallen { margin-top: 10px; font-size: 13px; color: var(--muted); font-style: italic; }
.cls { display: inline-block; font: 700 11px/1 var(--display); text-transform: uppercase; letter-spacing: 0.1em; padding: 3px 6px; border-radius: 3px; background: var(--cls-bg); color: var(--cls-fg); white-space: nowrap; }
.cls-heavy { --cls-bg: #3a2c1d; --cls-fg: #f0b86a; }
.cls-scout { --cls-bg: #1f3324; --cls-fg: #8fd9a0; }
.cls-medic { --cls-bg: #3a1f22; --cls-fg: #ff9e9e; }
.cls-drone { --cls-bg: #1b2f3a; --cls-fg: #8fd3ec; }
.ability { margin: 4px 0 0 28px; font-size: 13px; color: var(--muted); }
.recruit { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
.recruit-btns, .class-pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
.class-card { display: grid; gap: 6px; justify-items: start; text-align: left; }
.class-card small { font-size: 12.5px; }
.vehicles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.veh { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; cursor: pointer; display: grid; gap: 4px; align-content: start; }
.veh.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.veh input { position: absolute; opacity: 0; pointer-events: none; }
.veh-head { display: flex; justify-content: space-between; gap: 6px; }
.veh .cost { font: 12px var(--mono); color: var(--gold); }
.veh small { font-size: 12.5px; }
.launch { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.budget { display: flex; gap: 18px; font: 14px var(--mono); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.budget .bad { color: var(--bad); }

/* reports */
.report { max-width: 720px; margin: 24px auto; padding: 24px 28px; }
.narrative { padding-left: 20px; margin: 18px 0 26px; display: grid; gap: 10px; font-size: 16px; }
.narrative li { animation: reveal 0.5s both; }
.narrative li.bad { color: #ffb6ae; }
@keyframes reveal { from { opacity: 0.15; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* tactical */
.tactical { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; height: calc(100dvh - 112px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 480px; }
.board { position: relative; min-height: 0; min-width: 0; border-radius: var(--radius); background: radial-gradient(ellipse at center, #161c1d 0%, #0a0d0e 75%); border: 1px solid var(--line); overflow: hidden; }
.board-scroll { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
#board { width: 100%; height: 100%; display: block; cursor: crosshair; }
.hud { position: absolute; top: 10px; left: 12px; display: flex; gap: 8px; align-items: center; font: 14px var(--mono); pointer-events: none; flex-wrap: wrap; }
.hud .turn b { color: var(--accent); }
.hint { position: absolute; bottom: 10px; left: 12px; right: 12px; color: #b6c1be; font-size: 14px; pointer-events: none; text-shadow: 0 1px 3px #000; }
.banner { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); background: rgba(60,18,16,0.94); border: 1px solid var(--bad); color: var(--toast-fg); padding: 8px 16px; border-radius: 5px; font-weight: 600; animation: reveal 0.25s; max-width: 90%; text-align: center; pointer-events: none; }
.side { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; }
.obj { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; }
.obj small { display: block; }
.obj .mark { width: 16px; text-align: center; }
.obj.done .mark, .obj.progress .mark { color: var(--ok); }
.obj.failed .mark, .obj.failed b { color: var(--bad); }
.sq { display: grid; grid-template-columns: 1fr 70px auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--panel-2); border: 1px solid transparent; color: var(--fg); border-radius: 5px; padding: 8px 9px; margin-bottom: 6px; cursor: pointer; touch-action: manipulation; }
.sq.on { border-color: var(--accent); }
.sq.uav { margin-left: 14px; width: calc(100% - 14px); }
.sq.downed { cursor: default; opacity: 0.85; border-color: #4b2825; }
.sq .name .cls { margin-right: 4px; }
.bar { height: 5px; background: #0a0d0e; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
.pips { font-size: 10px; letter-spacing: 1px; color: var(--accent); }
.unit-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 12px; font-size: 14px; }
.orders { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.orders.end { margin-top: 8px; }
.log { flex: 1; min-height: 150px; display: flex; flex-direction: column; }
.log ol { list-style: none; margin: 0; padding: 0; overflow-y: auto; font-size: 13.5px; flex: 1; max-height: 320px; }
.log li { padding: 3px 0; border-bottom: 1px solid #1c2425; color: #b6c1be; }
.log .ev-turn { color: var(--accent); font-weight: 600; padding-top: 8px; }
.log .ev-alert, .log .ev-down { color: #ffb6ae; } .log .ev-kill { color: var(--bad); } .log .ev-intel { color: var(--gold); }
.log .ev-exfil, .log .ev-heal { color: var(--ok); }

/* debrief */
.debrief { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
.verdict { display: inline-block; margin: 10px 0; padding: 6px 14px; border-radius: 5px; font: 700 18px/1 var(--display); text-transform: uppercase; letter-spacing: 0.14em; }
.verdict.ok { background: #13301e; color: var(--ok); } .verdict.bad { background: #341715; color: var(--bad); }
.obj-results { list-style: none; padding: 0; display: grid; gap: 4px; }
.obj-results span { display: inline-block; width: 20px; }
.obj-results .ok span { color: var(--ok); } .obj-results .bad span { color: var(--bad); }
.table-wrap { overflow-x: auto; }
.personnel { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.personnel th, .personnel td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.personnel th { color: var(--muted); font-weight: 500; font-size: 13px; }
.personnel tr.lost td { color: var(--bad); }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.split ul { margin: 0; padding-left: 18px; }
.debrief > .btn { justify-self: end; }

@media (max-width: 980px) {
  .briefing { grid-template-columns: 1fr; }
  .vehicles { grid-template-columns: 1fr; }
  .tactical { grid-template-columns: 1fr; height: auto; min-height: 0; }
  .board { height: 58vh; min-height: 340px; }
  #board { min-width: 760px; }
  .side { overflow: visible; }
  .phases { display: none; }
  .launch { flex-direction: column; align-items: stretch; }
}
@media (max-width: 520px) {
  .loadout { grid-template-columns: 1fr; }
  .stats { gap: 10px; font-size: 12px; }
  h1 { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  .narrative li, .banner { animation: none; }
}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">SKIRM <span>tactical ops</span></div>
    <nav class="phases" id="phases" aria-label="Mission phase"></nav>
    <div class="stats" id="stats"></div>
    <a class="btn ghost" href="../index.html" style="text-decoration:none">Ops board</a>
    <button id="btn-new" class="btn ghost" type="button">New campaign</button>
  </header>
  <main id="view"><p class="muted">Loading command terminal…</p></main>
</div>
<div id="toast" role="status" hidden></div>

<script>
'use strict';
(() => {
// =====================================================================================
// RULES DATA: every balance number lives in these tables.
// =====================================================================================
const ITEMS = {
  CARBINE: { slot: 'WEAPON', label: 'Carbine', w: { ap: 2, range: 7, acc: 70, min: 3, max: 5 } },
  SMG: { slot: 'WEAPON', label: 'SMG', w: { ap: 1, range: 5, acc: 70, min: 1, max: 3 } },
  DMR: { slot: 'WEAPON', label: 'Marksman Rifle', w: { ap: 3, range: 11, acc: 80, min: 4, max: 6 } },
  LMG: { slot: 'WEAPON', label: 'LMG', w: { ap: 2, range: 8, acc: 58, min: 3, max: 6 } },
  AK: { slot: 'WEAPON', label: 'AK Rifle', w: { ap: 2, range: 7, acc: 62, min: 3, max: 5 } },
  VEST: { slot: 'ARMOR', label: 'Soft Vest', dr: 1, apPen: 0 },
  PLATE: { slot: 'ARMOR', label: 'Plate Carrier', dr: 2, apPen: 1 },
  MEDKIT: { slot: 'UTILITY', label: 'Medkit' },
  FRAG: { slot: 'UTILITY', label: 'Frag Grenade' },
  BREACH: { slot: 'UTILITY', label: 'Breaching Charge' },
  DRONE: { slot: 'UTILITY', label: 'Recon Drone' },
};
const TER = {
  OPEN: { mc: 1, pass: true }, ROAD: { mc: 1, pass: true }, ROUGH: { mc: 2, pass: true },
  LOW_COVER: { cover: 30 }, WALL: { cover: 40, block: true }, WATER: {},
};
const VEH = {
  HELO: { label: 'Helicopter', cost: 4, risk: 25, turns: 2, desc: 'Fast and direct: +2 turns on target. Loud, so a bad landing zone can alert the area. Extracts from the northern clearing.' },
  GROUND: { label: 'Ground Convoy', cost: 2, risk: 20, turns: 1, desc: 'Armoured trucks via the south road: +1 turn on target. Exposed to IEDs and roadblocks. Extracts from the road.' },
  FOOT: { label: 'On Foot', cost: 0, risk: 10, turns: 0, desc: 'Silent infiltration, no extra time. Rarely detected. Extract by walking out the western edge.' },
};
const INTEL = {
  SATELLITE: { label: 'Satellite Imagery', cost: 2, desc: 'Reveals terrain across the whole area of operations.' },
  HUMINT: { label: 'Deep Intelligence', cost: 3, desc: 'Reveals enemy strength, positions and expected reinforcements.' },
};
const OBJ = {
  RETRIEVE_INTEL: { label: 'Retrieve Intel', desc: 'Secure the intel cache inside the compound and get its carrier out.' },
  ELIMINATE_HVT: { label: 'Eliminate HVT', desc: 'A high-value target is holed up in the compound. Neutralise him.' },
  NO_CASUALTIES: { label: 'Leave No One', desc: 'Bring every operator home alive.' },
  UNDETECTED: { label: 'Ghost', desc: 'Complete the operation without the enemy ever raising the alarm.' },
};
const RANKS = [['PVT', 'Private', 0], ['PFC', 'Private First Class', 20], ['CPL', 'Corporal', 50], ['SGT', 'Sergeant', 90], ['SSG', 'Staff Sergeant', 140], ['LT', 'Lieutenant', 200]];
const MAX_TEAM = 4, BASE_TURNS = 12, GR_RANGE = 5, GR_AP = 2, MK_AP = 2, MK_HEAL = 5, COLS = 18, ROWS = 12;
const MEDIC_HEAL = 8, BLEED_TURNS = 2, REVIVE_AP = 2, REVIVE_HP = 3, BREACH_AP = 2;
const DRONE_LAUNCH_AP = 2, DRONE_HP = 3, DRONE_AP = 4, DRONE_VISION = 5, DRONE_TETHER = 8, STRIKE_AP = 2, STRIKE_RANGE = 3;
const RECRUIT_COST = 3, ROSTER_MIN = 6, ROSTER_MAX = 8;
// Class = permanent role fixed at recruitment. Gear lists are what the class may carry, in default-pick order.
const CLASSES = {
  HEAVY: { label: 'Heavy', letter: 'H', hp: 12, weapons: ['LMG', 'CARBINE', 'AK'], armor: ['PLATE', 'VEST'], utility: ['BREACH', 'FRAG'],
    ability: 'Breach: blows an adjacent wall or cover into rubble (charge, 2 AP). Toughest class.' },
  SCOUT: { label: 'Scout', letter: 'S', hp: 9, weapons: ['DMR', 'SMG', 'CARBINE', 'AK'], armor: ['VEST'], utility: ['FRAG', 'MEDKIT'],
    ability: 'Stealth: enemies detect them at half range. Sees 2 hexes further.' },
  MEDIC: { label: 'Medic', letter: 'M', hp: 10, weapons: ['CARBINE', 'SMG', 'AK'], armor: ['VEST'], utility: ['MEDKIT'],
    ability: `Revive: brings a downed adjacent operator back (${REVIVE_AP} AP). Medkits heal +${MEDIC_HEAL}.` },
  DRONE: { label: 'Drone Operator', letter: 'D', hp: 10, weapons: ['SMG', 'CARBINE', 'AK'], armor: ['VEST'], utility: ['DRONE', 'FRAG'],
    ability: 'Recon drone: flies over walls, sees 5 hexes without line of sight, spots targets (+10 to hit), carries one strike.' },
};
const ADJ = ['Silent', 'Iron', 'Broken', 'Pale', 'Crimson', 'Hollow', 'Distant', 'Bitter', 'Northern', 'Sudden'];
const NOUN = ['Harrier', 'Lantern', 'Anvil', 'Meridian', 'Thicket', 'Sparrow', 'Bastion', 'Ember', 'Gauntlet', 'Kestrel'];
const AREAS = ['Walled farmstead in the Varra highlands', "Abandoned pumping station on the Dry Fork", "Smuggler's waystation near the Kessel border crossing", 'Fortified orchard outside the town of Ostrow', 'Derelict customs post in the Saltmarsh lowlands'];
const FIRST = ['Alex', 'Sam', 'Jordan', 'Riley', 'Casey', 'Morgan', 'Niko', 'Tariq', 'Elena', 'Mika', 'Jonas', 'Aino', 'Viktor', 'Lena', 'Omar', 'Petra', 'Dario', 'Iris', 'Kai', 'Sasha'];
const LAST = ['Hale', 'Korhonen', 'Reyes', 'Novak', 'Brandt', 'Okafor', 'Lindqvist', 'Marsh', 'Varga', 'Sato', 'Kowalski', 'Moreau', 'Haddad', 'Petrov', 'Quinn', 'Aalto', 'Ferreira', 'Doyle', 'Ivanova', 'Kerr'];

const rankIdx = (xp) => { let i = 0; RANKS.forEach((r, k) => { if (xp >= r[2]) i = k; }); return i; };
const nextXp = (xp) => { const i = rankIdx(xp); return i + 1 < RANKS.length ? RANKS[i + 1][2] : -1; };
const vision = (e) => Math.max(3, { DAY: 8, DUSK: 7, NIGHT: 5 }[e.time] - { CLEAR: 0, RAIN: 1, FOG: 3 }[e.weather]);

// =====================================================================================
// ENEMY AI: unaware = loiter near post and raise the alarm on sight;
// alerted = shoot if the odds are acceptable, else score reachable hexes (closing, firing position, cover).
// =====================================================================================
function enemyTurn() {
  const b = B();
  for (const e of [...b.units]) {
    if (e.side !== 'E' || !onMap(e)) continue;
    e.ap = maxAp(e);
    if (!b.alerted) {
      if (!e.hvt && chance(50)) {
        const reach = reachOf(e, 2);
        const opts = Object.keys(reach.cost).filter((k) => k !== reach.origin && dist(unK(k), e.post) <= 3).sort();
        if (opts.length) moveEnemy(e, pathTo(reach, unK(pick(opts))));
      }
      const p = playerTargets().find((p) => enemySees(e.h, p.h, p));
      if (p) alarm(`${isVis(e.h) ? e.name : 'A sentry'} spotted ${isDrone(p) ? 'the drone' : p.name}! The area is alerted.`);
    } else engage(e);
  }
}
function bestTarget(e, from) {
  let best = null, bc = -1;
  for (const p of playerTargets()) { // drones included; their -20 makes operators the usual pick
    if (dist(from, p.h) > gun(e).range || !enemySees(from, p.h, p)) continue;
    const c = hitChance(e, from, p).chance;
    if (c > bc) { best = p; bc = c; }
  }
  return best;
}
function score(e, h) {
  let near = null;
  for (const p of squad()) if (onMap(p) && (!near || dist(h, p.h) < dist(h, near.h))) near = p;
  if (!near) return 0;
  let s = -dist(h, near.h);
  const saved = e.h;
  e.h = h;
  const t = bestTarget(e, h);

}

    const cost = gun(e).ap, t = bestTarget(e, e.h);
    if (t && e.ap >= cost && hitChance(e, e.h, t).chance >= 25) { resolveShot(e, t); continue; }
    if (e.hvt) return;
    const reach = reachOf(e, e.ap >= cost * 2 ? e.ap - cost : e.ap);
    let best = e.h, bs = score(e, e.h);
    for (const k of Object.keys(reach.cost)) {

  if (!seen.length) return;
  const now = isVis(e.h);
  if (now) B().lastSeen[e.id] = K(e.h);
  emit({ type: 'move', unit: e.id, path: seen, text: now && !was ? `Movement: ${e.name} sighted.` : null });
}

// =====================================================================================
// PHASES: briefing → insertion → tactical → extraction → debrief
// =====================================================================================
function need(p) { if (G.phase !== p) fail(`Not possible during ${p.toLowerCase()}.`); }

function buyIntel(id) {
  need('BRIEFING');
  const m = G.mission, i = INTEL[id];
  if (m.intel.includes(id)) fail(`${i.label} already acquired.`);
  if (G.rp < i.cost) fail(`${i.label} costs ${i.cost} RP; you have ${G.rp}.`);
  G.rp -= i.cost;
  m.intel.push(id);
}
function launch(o) {
  need('BRIEFING');
  if (!o.team.length || o.team.length > MAX_TEAM) fail(`Select between 1 and ${MAX_TEAM} operators.`);
  const needed = {}, team = [];
  for (const id of o.team) {
    const s = soldier(id);
    if (!s || !available(s)) fail('That operator is not available.');
    const l = o.loadouts[id];
    if (!l || !l.weapon) fail(`${s.name} needs a weapon.`);
    const cl = CLASSES[s.cls];
    for (const [it, list] of [[l.weapon, cl.weapons], [l.armor, cl.armor], [l.utility, cl.utility]])
      if (it && !list.includes(it)) fail(`A ${cl.label} can't carry ${ITEMS[it]?.label ?? it}.`);
    for (const it of [l.weapon, l.armor, l.utility]) if (it) needed[it] = (needed[it] || 0) + 1;
    team.push(s);
  }
  for (const [it, n] of Object.entries(needed)) if ((G.armory[it] || 0) < n) fail(`The armory is short of ${ITEMS[it].label}.`);
  const cost = VEH[o.insertion].cost + VEH[o.extraction].cost;
  if (cost > G.rp) fail(`Transport costs ${cost} RP; you have ${G.rp}.`);
  for (const [it, n] of Object.entries(needed)) G.armory[it] -= n;
  G.rp -= cost;
  const m = G.mission;
  m.team = [...o.team];
  m.loadouts = JSON.parse(JSON.stringify(o.loadouts));
  m.ins = o.insertion;
  m.ext = o.extraction;
  makeBattle(m, team);
  m.insReport = insertion(m);
  G.phase = 'INSERTION';
}
function insertion(m) {
  const rep = [{ HELO: 'The helicopter runs in low over the ridgeline toward the drop point.', GROUND: 'The convoy rolls in along the south road, lights off.', FOOT: 'The team moves in on foot through the treeline on the western approach.' }[m.ins]];
  if (!chance(Math.round(VEH[m.ins].risk * compFactor(m.env)))) { rep.push('Insertion clean. The team is on the ground, undetected.'); return rep; }
  const victim = pick(squad()), first = chance(50);
  const injure = (n) => { victim.hp = Math.max(1, victim.hp - n); };
  const delay = () => { B().limit = Math.max(B().turn + 2, B().limit - 2); };
  if (m.ins === 'HELO') {
    if (first) { rep.push('HOT LZ: small-arms fire on approach. The enemy knows you are here.'); alarm('Hot LZ: the enemy is alerted.'); }
    else { rep.push(`Hard landing. ${victim.name} is hurt in the drop (-2 HP).`); injure(2); }
  } else if (m.ins === 'GROUND') {
    if (first) { rep.push(`IED strike on the lead vehicle! ${victim.name} is wounded (-3 HP).`); injure(3); }
    else { rep.push('Roadblock. Forced detour: 2 turns lost on target.'); delay(); }
  } else if (first) { rep.push('A goatherd spots the team and runs for the compound. Expect them to be ready.'); alarm('Spotted on approach: the enemy is alerted.'); }

}
function extraction(m) {
  const b = B(), rep = [];
  const out = squad().filter((u) => u.exfil && u.hp > 0), left = squad().filter((u) => u.stranded && u.hp > 0);
  const zone = b.ext.map(unK);
  const near = b.units.filter((e) => e.side === 'E' && onMap(e) && Math.min(...zone.map((z) => dist(z, e.h))) <= 6).length;
  const hot = b.alerted && near > 0;

    rep.push({ HELO: 'Rotor wash flattens the clearing as the helicopter flares in.', GROUND: 'The trucks swing round on the road, tailgates down.', FOOT: 'The team slips back out through the western treeline.' }[m.ext]);
    if (hot) {
      rep.push(`${near} hostile(s) within range of the extraction point. Taking fire!`);
      const c = { HELO: 30, GROUND: 25, FOOT: 40 }[m.ext];
      for (const u of out) {
        if (!chance(c)) continue;
        const d = range(1, 3);
        u.hp = Math.max(0, u.hp - d);
        rep.push(u.hp > 0 ? `${u.name} is hit during extraction (-${d} HP).` : `${u.name} is killed during extraction.`);
      }
    } else rep.push('Extraction clean. No contact.');
  }
  for (const u of left) {
    rep.push(`${u.name} missed the extraction and attempts to escape on foot...`);
    if (chance(b.alerted ? 45 : 20)) { u.missing = true; rep.push(`Contact lost. ${u.name} is missing in action.`); }
    else { const d = range(1, 4); u.hp = Math.max(1, u.hp - d); u.exfil = true; rep.push(`${u.name} reaches friendly lines two days later, battered (-${d} HP).`); }
  }

}
function debrief(m) {
  const b = B(), sq = squad();

  const carrier = b.carrier != null ? unitById(b.carrier) : null;
  const intelOut = !!carrier && carrier.exfil && carrier.hp > 0;
  const done = (t) => ({ RETRIEVE_INTEL: intelOut, ELIMINATE_HVT: b.hvtKilled, NO_CASUALTIES: anyOut && !casualties, UNDETECTED: anyOut && !b.alerted })[t];

  const rp = 2 + (success ? 8 : 0) + (done(m.secondary) ? 4 : 0);
  G.rp += rp;
  const soldiers = [], lost = [], gained = [], notes = [];
  for (const u of sq) {
    const s = soldier(u.sid), before = rankIdx(s.xp);
    let xp = 0, status;
    if (u.hp <= 0 || u.missing) {
      status = u.missing ? 'MIA' : 'KIA';
      s.alive = false;
      for (const it of [u.weapon, u.armor, u.util]) if (it) lost.push(`${ITEMS[it].label} (${u.name})`);
    } else {
      xp = 10 + (success ? 10 : 0) + u.kills * 8 + (u.killedHvt ? 25 : 0) + (carrier === u && intelOut ? 15 : 0) + u.revives * 10;
      if (u.hp <= u.maxHp / 2) { status = 'Heavy wound: misses next mission'; s.recovery = 2; }

    }
    if (u.consumed) lost.push(`${ITEMS[u.consumed].label} (expended)`);
    if (u.droneLost) lost.push(`Recon Drone (shot down)`);
    s.xp += xp; s.kills += u.kills; s.missions++;
    const after = rankIdx(s.xp);

  }

    const dead = b.units.filter((u) => u.side === 'E' && u.hp <= 0).length;
    for (let i = 0; i < dead; i++) if (chance(30)) { G.armory.AK = (G.armory.AK || 0) + 1; gained.push('AK Rifle (captured)'); }
    if (b.hvtKilled && chance(50)) { G.armory.SMG++; gained.push("SMG (HVT's personal weapon)"); }
    if (intelOut) { const it = chance(50) ? 'MEDKIT' : 'FRAG'; G.armory[it] += 2; gained.push(`2x ${ITEMS[it].label} (cache location from recovered intel)`); }
  }
  const weapons = () => Object.keys(ITEMS).filter((k) => ITEMS[k].slot === 'WEAPON').reduce((n, k) => n + (G.armory[k] || 0), 0);
  while (weapons() < 4) { G.armory.CARBINE++; gained.push('Carbine (quartermaster replacement)'); }
  G.recruits = Math.max(0, ROSTER_MIN - G.roster.filter((s) => s.alive).length);
  if (G.recruits) notes.push(`${G.recruits} replacement slot${G.recruits > 1 ? 's' : ''} open. Choose a class for each below.`);
  G.flown++;
  return { success, objectives: [{ label: OBJ[m.primary].label, primary: true, ok: done(m.primary) }, { label: OBJ[m.secondary].label, primary: false, ok: done(m.secondary) }], soldiers, lost, gained, rp, notes };
}
function proceed() {
  if (G.phase === 'INSERTION') G.phase = 'TACTICAL';
  else if (G.phase === 'EXTRACTION') { G.debrief = debrief(G.mission); G.phase = 'DEBRIEF'; }
  else if (G.phase === 'DEBRIEF') {

  } else fail('Nothing to continue.');
}
/** Free replacement slots after a debrief; otherwise buy an extra recruit during the briefing. */
function enlist(cls) {
  if (!CLASSES[cls]) fail('Unknown class.');
  if (G.phase === 'DEBRIEF' && G.recruits > 0) { G.recruits--; return recruit(0, cls); }
  need('BRIEFING');
  if (G.roster.filter((s) => s.alive).length >= ROSTER_MAX) fail(`The roster is full (${ROSTER_MAX} operators).`);
  if (G.rp < RECRUIT_COST) fail(`Recruiting costs ${RECRUIT_COST} RP; you have ${G.rp}.`);

}

// =====================================================================================
// RENDERER: isometric hex view. Pure drawing, no rules.
// =====================================================================================
const SQ3 = Math.sqrt(3), ISO = 0.6;

const $ = (s, r = document) => r.querySelector(s);

let toastTimer;

const SAVE_KEY = 'skirm-save-v2'; // v2 = classes; older saves start a new campaign
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { /* storage unavailable: play continues unsaved */ } }

let mounted = null;
const draft = { mission: null, team: [], loadouts: {}, insertion: 'FOOT', extraction: 'FOOT' };
const tac = { view: null, selected: null, mode: 'move', hover: null, busy: false, fx: [], anim: new Map(), raf: 0, abortArmed: false, cache: null, pointer: 'mouse' };

function run(fn) {
  if (tac.busy) return;
  pending = [];
  try { fn(); } catch (e) {
    pending = [];
    if (e instanceof Rule) return toast(e.message);
    console.error(e);
    return toast('Unexpected error: ' + e.message);
  }
  const evs = pending;
  pending = [];
  persist();
  refresh();
  if (G.phase === 'TACTICAL' && evs.length) playEvents(evs);
}

const PHASES = [['BRIEFING', 'Briefing'], ['INSERTION', 'Insertion'], ['TACTICAL', 'Operation'], ['EXTRACTION', 'Extraction'], ['DEBRIEF', 'Debrief']];
function refresh() {
  if (G.phase !== mounted) { mounted = G.phase; mount(); }
  const idx = PHASES.findIndex(([p]) => p === G.phase);
  $('#phases').innerHTML = PHASES.map(([p, l], i) => `<span class="${i === idx ? 'on' : i < idx ? 'done' : ''}">${l}</span>`).join('<i>›</i>');
  $('#stats').innerHTML = `<span><b>Mission</b>${G.flown + 1}</span><span><b>RP</b>${G.rp}</span><span><b>Operators</b>${G.roster.filter((s) => s.alive).length}</span>`;
  if (G.phase === 'BRIEFING') renderBriefing();
  else if (G.phase === 'INSERTION' || G.phase === 'EXTRACTION') renderReport();
  else if (G.phase === 'TACTICAL') updateTactical();
  else renderDebrief();
}
function mount() {
  cancelAnimationFrame(tac.raf);
  window.scrollTo(0, 0);
  const v = $('#view');
  v.innerHTML = '';
  if (G.phase === 'TACTICAL') mountTactical(v);
}

// ------------------------------------------------------------------ briefing
function remaining() {
  const left = { ...G.armory };
  for (const id of draft.team) for (const it of Object.values(draft.loadouts[id])) if (it) left[it] = (left[it] || 0) - 1;
  return left;
}
function defaultLoadout(cls) {
  const left = remaining(), first = (p) => p.find((x) => (left[x] || 0) > 0) || null, cl = CLASSES[cls];
  return { weapon: first(cl.weapons), armor: first(cl.armor), utility: first(cl.utility) };
}
const classOf = (id) => soldier(+id).cls;
const classChip = (cls) => `<span class="cls cls-${cls.toLowerCase()}">${CLASSES[cls].label}</span>`;
function syncDraft() {
  if (draft.mission === G.mission.n + ':' + G.flown + ':' + G.mission.codename) return;
  draft.mission = G.mission.n + ':' + G.flown + ':' + G.mission.codename;
  Object.assign(draft, { team: [], loadouts: {}, insertion: 'FOOT', extraction: 'FOOT' });
  for (const s of G.roster) {
    if (!available(s) || draft.team.length >= MAX_TEAM) continue;
    const l = defaultLoadout(s.cls);
    if (!l.weapon) break;
    draft.team.push(s.id);
    draft.loadouts[s.id] = l;
  }
}

    const own = m.intel.includes(id);
    return `<div class="intel-row"><div><b>${i.label}</b><small>${i.desc}</small></div>${own ? '<span class="chip ok">Acquired</span>' : `<button class="btn" type="button" data-intel="${id}" ${G.rp < i.cost ? 'disabled' : ''}>Buy · ${i.cost} RP</button>`}</div>`;
  }).join('');
  const humint = m.intel.includes('HUMINT') ? `<div class="humint"><div><b>${m.spawns.length}</b> hostiles confirmed. Positions marked on the map.</div><div>${m.rTurn ? `Expect ${m.rCount} reinforcements from the east around turn ${m.rTurn}.` : 'No reinforcements expected.'}</div></div>` : '';

  const verb = touch ? 'tap' : 'click';
  let text = !u ? 'All operators have left the map.'
    : isDrone(u) ? `${u.name}: ${verb} a highlighted hex to fly. Hostiles it sees are easier to hit.`
    : `${u.name}: ${verb} a highlighted hex to move or a ringed hostile to fire.`;
  const modeHint = {
    breach: `Breach: ${verb} a highlighted wall or cover hex. Loud.`,
    revive: `Revive: ${verb} a downed operator next to the medic.`,
    strike: `Drone strike: radius 1, 3-5 damage, within ${STRIKE_RANGE} hexes of the drone.`,
  }[tac.mode];
  if (modeHint) text = modeHint;
  if (u && o && tac.hover && !modeHint) {
    const there = unitAt(tac.hover), hc = there && o.targets.get(there.id), mv = o.moves.get(K(tac.hover)), again = touch ? ' Tap again to confirm.' : '';
    if (tac.mode === 'grenade') text = `Grenade: radius 1, 3-5 damage, ignores cover. It hurts your own team too.${again}`;
    else if (tac.mode === 'medkit') text = `Medkit: ${verb} yourself or an adjacent wounded operator.`;
    else if (hc) text = `Fire at ${there.name} (${there.hp}/${there.maxHp} HP): ${hc.chance}%${hc.mods.length ? ' [' + hc.mods.join(', ') + ']' : ''}.${again}`;
    else if (there && there.side === 'E') text = `${there.name}: ${ITEMS[there.weapon].label}, ${there.hp}/${there.maxHp} HP. No shot from here.`;
    else if (mv) text = `Move: ${mv.c} AP.${again}`;
  }
  el.textContent = text;
}

async function playEvents(events) {
  tac.busy = true;
  const v = tac.view, fx = (f) => tac.fx.push({ t0: performance.now(), ...f });
  for (const e of events) if (e.type === 'move' && e.path.length > 1) tac.anim.set(e.unit, v.center(e.path[0].q, e.path[0].r));
  for (const e of events) {
    if (e.type === 'move') { if (e.path.length > 1) await animateMove(e.unit, e.path); tac.anim.delete(e.unit); }
    else if (e.type === 'shot') {
      if (e.from) fx({ kind: 'tracer', from: e.from, to: e.to, hit: e.hit, dur: 320 }); else fx({ kind: 'flash', at: e.to, dur: 500 });
      fx({ kind: 'text', at: e.to, text: e.hit ? `-${e.amount}` : 'MISS', color: e.hit ? '#ffd27a' : '#cfd6dc', dur: 1000 });
      await sleep(340);
    } else if (e.type === 'grenade') { fx({ kind: 'tracer', from: e.from, to: e.to, hit: false, dur: 260 }); await sleep(240); fx({ kind: 'boom', at: e.to, dur: 600 }); await sleep(200); }
    else if (e.type === 'damage') { fx({ kind: 'text', at: e.to, text: `-${e.amount}`, color: '#ff8a80', dur: 1000 }); await sleep(90); }
    else if (e.type === 'kill') {
      const k = unitById(e.unit), label = !k || k.side === 'E' ? 'DOWN' : isDrone(k) ? 'LOST' : 'KIA';
      fx({ kind: 'text', at: e.to, text: label, color: '#ff6b6b', dur: 1200 }); await sleep(220);
    } else if (e.type === 'down') { fx({ kind: 'text', at: e.to, text: 'DOWNED', color: '#ffb6ae', dur: 1400 }); banner(e.text); await sleep(300); }
    else if (e.type === 'breach') { fx({ kind: 'boom', at: e.to, dur: 600 }); await sleep(300); }
    else if (e.type === 'heal') { fx({ kind: 'text', at: e.to, text: `+${e.amount}`, color: '#7ee07e', dur: 1000 }); await sleep(200); }
    else if (e.type === 'intel') fx({ kind: 'text', at: e.to, text: 'INTEL', color: C.intel, dur: 1200 });
    else if (e.type === 'exfil') fx({ kind: 'text', at: e.to, text: 'EXFIL', color: '#8be09b', dur: 1200 });
    else if (e.type === 'alert') { banner(e.text); await sleep(250); }
  }
  tac.anim.clear();
  tac.busy = false;
  if (G.phase === 'TACTICAL') updateTactical();
}
function animateMove(id, path) {
  const v = tac.view, pts = path.map((h) => v.center(h.q, h.r)), t0 = performance.now(), total = 110 * (pts.length - 1);
  return new Promise((res) => {
    const tick = (now) => {
      const t = Math.min(1, (now - t0) / total), f = t * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(f)), k = f - i;
      tac.anim.set(id, { x: pts[i].x + (pts[i + 1].x - pts[i].x) * k, y: pts[i].y + (pts[i + 1].y - pts[i].y) * k });
      t < 1 ? requestAnimationFrame(tick) : res();
    };
    requestAnimationFrame(tick);
  });
}
function banner(text) {
  const b = $('.board');
  if (!b) return;
  const el = document.createElement('div');
  el.className = 'banner'; el.textContent = text; b.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// ------------------------------------------------------------------ debrief
function renderDebrief() {
  const d = G.debrief, m = G.mission;
  const list = (a, empty) => (a.length ? `<ul>${a.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : `<p class="muted">${empty}</p>`);
  $('#view').innerHTML = `<section class="debrief">
    <div class="card"><div class="eyebrow">Mission ${m.n} · Debrief</div><h1>${esc(m.codename)}</h1>
      <div class="verdict ${d.success ? 'ok' : 'bad'}">${d.success ? 'Mission success' : 'Mission failed'}</div>
      <ul class="obj-results">${d.objectives.map((o) => `<li class="${o.ok ? 'ok' : 'bad'}"><span>${o.ok ? '✓' : '✗'}</span>${o.primary ? 'Primary' : 'Secondary'}: <b>${o.label}</b></li>`).join('')}</ul>
      <p>Requisition awarded: <b>+${d.rp} RP</b></p></div>
    <div class="card"><h3>Personnel</h3><div class="table-wrap"><table class="personnel"><thead><tr><th>Operator</th><th>Status</th><th>HP</th><th>Kills</th><th>XP</th><th>Rank</th></tr></thead><tbody>
      ${d.soldiers.map((s) => `<tr class="${/KIA|MIA/.test(s.status) ? 'lost' : ''}"><td>${esc(s.name)} ${classChip(s.cls)}</td><td>${s.status}</td><td>${s.hp}/${s.maxHp}</td><td>${s.kills}</td><td>${s.xp ? '+' + s.xp : '-'}</td><td>${s.promoted ? `<span class="chip gold">Promoted: ${s.promoted}</span>` : s.rank}</td></tr>`).join('')}
    </tbody></table></div></div>
    <div class="card split"><div><h3>Gear lost</h3>${list(d.lost, 'Nothing lost.')}</div><div><h3>Gear gained</h3>${list(d.gained, 'Nothing recovered.')}</div>${d.notes.length ? `<div><h3>Notes</h3>${list(d.notes, '')}</div>` : ''}</div>
    ${G.recruits > 0 ? `<div class="card"><h3>Replacements · ${G.recruits} to assign</h3><p class="muted">Pick the class of each new recruit.</p>
      <div class="class-pick">${Object.entries(CLASSES).map(([id, c]) => `<button class="btn class-card" type="button" data-enlist="${id}">${classChip(id)}<small>${c.hp} HP · ${c.ability}</small></button>`).join('')}</div></div>` : ''}
    <button class="btn primary big" type="button" id="next" ${G.recruits > 0 ? 'disabled' : ''}>Next mission</button></section>`;
  $('#view').querySelectorAll('[data-enlist]').forEach((b) => b.addEventListener('click', () => run(() => { const s = enlist(b.dataset.enlist); toast(`${s.name} joins as ${CLASSES[s.cls].label}.`); })));
  $('#next').addEventListener('click', () => run(proceed));
}

// ------------------------------------------------------------------ input + boot
document.addEventListener('keydown', (e) => {
  if (G?.phase !== 'TACTICAL' || e.target.closest('input,select,textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'tab') {
    e.preventDefault();
    const list = mine();
    if (!list.length) return;
    tac.selected = list[(list.findIndex((u) => u.id === tac.selected) + 1) % list.length].id;
    tac.mode = 'move';
    updateTactical();
  } else if (k === 'escape') setMode('move');
  else if (k === 'e') order('end');
  else if (k === 'g') order('grenade');
  else if (k === 'h') order('medkit');
  else if (k === 'i') order('intel');
  else if (k === 'x') order('exfil');
});
window.addEventListener('resize', () => { if (G?.phase === 'BRIEFING') drawPreview(); });
$('#btn-new').addEventListener('click', (e) => {
  const b = e.currentTarget;
  if (b.dataset.armed) {
    delete b.dataset.armed; b.textContent = 'New campaign';
    if (tac.busy) return;
    draft.mission = null; mounted = null;
    newCampaign((Math.random() * 2 ** 31) | 0);
    persist(); refresh();
    return;
  }
  b.dataset.armed = '1'; b.textContent = 'Tap again to restart';
  setTimeout(() => { delete b.dataset.armed; b.textContent = 'New campaign'; }, 3000);
});

function start(data) {
  let save = data && data.save;
  if (!save) { try { save = localStorage.getItem(SAVE_KEY); } catch (e) { save = null; } }
  try { G = save ? JSON.parse(save) : null; } catch (e) { G = null; }
  if (!G || G.v !== 2) newCampaign((Math.random() * 2 ** 31) | 0);
  window.claude?.hot?.snapshot?.(() => ({ save: JSON.stringify(G) }));
  refresh();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
